name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arch:
    name: Build Arch package
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel rust cargo git libxkbcommon wayland fontconfig
      - name: Fetch pinned Rune checkout
        run: |
          git clone --depth 1 https://github.com/anomalyco/rune.git prototypes/_rune-upstream
          cd prototypes/_rune-upstream
          git fetch --depth 1 origin db301c06ab0d68b70c4822a542fffc6615bbd419
          git checkout db301c06ab0d68b70c4822a542fffc6615bbd419
      - name: Build
        run: |
          cd clove-rs
          cargo build -p clove-ui --release
      - name: Package
        run: |
          mkdir -p out
          cp clove-rs/target/release/clove out/clove
          cp packaging/arch/clove.desktop out/
          tar -czf out/clove-arch.tar.gz -C out clove clove.desktop
      - uses: actions/upload-artifact@v4
        with:
          name: clove-arch
          path: out/clove-arch.tar.gz

  release:
    name: Publish GitHub release
    needs: [build-arch]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/clove-arch/clove-arch.tar.gz
          generate_release_notes: true
