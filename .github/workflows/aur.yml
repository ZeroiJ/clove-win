name: Publish AUR

on:
  workflow_call:
    inputs:
      version:
        description: "Release version or tag (e.g. v1.6.2 or 1.6.2); defaults to PKGBUILD pkgver"
        required: false
        type: string
    secrets:
      AUR_SSH_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Release version or tag (e.g. v1.6.2 or 1.6.2); defaults to PKGBUILD pkgver"
        required: false
        type: string

jobs:
  aur:
    name: Publish to AUR
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel git openssh curl

      - name: Sync PKGBUILD & generate .SRCINFO
        working-directory: packaging/aur
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          RAW_VER="${INPUT_VERSION#v}"
          CURRENT_VER="$(sed -n 's/^pkgver=//p' PKGBUILD | head -n1)"
          TARGET_VER="${RAW_VER:-$CURRENT_VER}"
          if [ -z "$TARGET_VER" ] || ! printf '%s' "$TARGET_VER" | grep -Eq '^[0-9A-Za-z._+]+$'; then
            echo "Invalid pkgver: '$TARGET_VER'" >&2
            exit 1
          fi

          if [ "$TARGET_VER" != "$CURRENT_VER" ]; then
            sed -i "s/^pkgver=.*/pkgver=${TARGET_VER}/" PKGBUILD
            sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          fi

          curl -fsSLo /dev/null "https://github.com/ZeroiJ/clove-win/archive/refs/tags/v${TARGET_VER}.tar.gz"

          # makepkg refuses to run as root; use an unprivileged user.
          useradd -m builder 2>/dev/null || true
          chown -R builder .
          su builder -c 'makepkg --printsrcinfo' > .SRCINFO

      - name: Configure SSH
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "AUR_SSH_PRIVATE_KEY secret is not set" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null

      - name: Publish
        env:
          GIT_SSH_COMMAND: "ssh -i ~/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
        run: |
          git clone ssh://aur@aur.archlinux.org/clove-linux.git aur-clove
          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO aur-clove/
          cd aur-clove
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR package is already up to date."
            exit 0
          fi
          PKGVER="$(sed -n 's/^pkgver=//p' PKGBUILD | head -n1)"
          PKGREL="$(sed -n 's/^pkgrel=//p' PKGBUILD | head -n1)"
          git commit -m "Update to ${PKGVER}-${PKGREL}"
          git push
