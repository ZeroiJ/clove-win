[workspace]
resolver = "2"
members = [
    "crates/clove-fs",
    "crates/clove-search",
    "crates/clove-render",
    "crates/clove-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
clove-fs = { path = "crates/clove-fs" }
clove-search = { path = "crates/clove-search" }
clove-render = { path = "crates/clove-render" }

[profile.release]
lto = "thin"
codegen-units = 1
